name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Monorepo
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ Enable Corepack (for Yarn v3+)
        run: corepack enable

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install

      - name: 🛠 Build all workspaces
        run: yarn build:all

    #   - name: ✅ Lint (optional)
    #     run: yarn workspaces run lint || echo "No lint script found"

    #   - name: 🧪 Test (optional)
    #     run: yarn workspaces run test || echo "No test script found"
